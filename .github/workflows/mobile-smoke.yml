name: Mobile browser smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: Chromium responsive smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install project tooling
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static preview
        run: |
          node scripts/serve-preview.mjs > /tmp/velora-preview.log 2>&1 &
          echo $! > /tmp/velora-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/velora-preview.log
          exit 1

      - name: Check mobile and tablet layouts
        env:
          VELORA_BASE_URL: http://127.0.0.1:4173
        run: node scripts/mobile-smoke.mjs

      - name: Check product sizing and add-to-cart flow
        env:
          VELORA_BASE_URL: http://127.0.0.1:4173
        run: node scripts/storefront-smoke.mjs
