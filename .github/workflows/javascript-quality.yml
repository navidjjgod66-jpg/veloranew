name: JavaScript quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Syntax · Lint · Format · Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install tooling
        run: npm ci --ignore-scripts

      - name: Check every first-party JavaScript module
        run: npm run syntax

      - name: Validate HTML syntax
        run: npm run html:syntax

      - name: ESLint
        run: npm run lint

      - name: Prettier (check)
        run: npm run format:check

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, pdo_mysql
          coverage: none

      - name: Lint PHP API and private configuration template
        run: |
          php -l api/index.php
          php -l api/admin.php
          php -l admin/index.php
          php -l api/config.local.php.example
          php -r '$c = require "api/config.local.php.example"; if ($c["zarinpal_sandbox"] !== true || $c["product_prices_toman"]["aster"] !== null || $c["shipping_toman"] !== null || $c["tax_toman"] !== null) { fwrite(STDERR, "Unsafe example defaults\\n"); exit(1); }'

      - name: Unit tests
        run: npm test
