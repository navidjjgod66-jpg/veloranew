name: JavaScript quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Syntax · Lint · Format · Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install tooling
        run: npm ci --ignore-scripts

      - name: Check every first-party JavaScript module
        run: npm run syntax

      - name: ESLint
        run: npm run lint

      - name: Temporary formatting preview
        run: |
          npx prettier --write index.html tests/core.test.js README.md
          git diff --unified=2 -- index.html tests/core.test.js README.md

      - name: Prettier (check)
        run: npm run format:check

      - name: Unit tests
        run: npm test
