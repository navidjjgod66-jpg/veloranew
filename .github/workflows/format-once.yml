name: One-time format correction

on:
  push:
    branches:
      - feat/zarinpal-melipayamak-mobile-2026

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/zarinpal-melipayamak-mobile-2026
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install project formatter
        run: npm ci --ignore-scripts

      - name: Format changed files
        run: npx prettier --write assets/css/commerce.css assets/js/api.js assets/js/auth.js assets/js/cart.js tests/backend-contract.test.js

      - name: Commit format corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/commerce.css assets/js/api.js assets/js/auth.js assets/js/cart.js tests/backend-contract.test.js
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "style: format secure commerce implementation"
          git push origin HEAD:feat/zarinpal-melipayamak-mobile-2026
