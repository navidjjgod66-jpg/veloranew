name: Temporary storefront formatting

on:
  push:
    branches:
      - feat/zarinpal-melipayamak-mobile-2026

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/zarinpal-melipayamak-mobile-2026
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write assets/js/render.js assets/js/reader.js
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/render.js assets/js/reader.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format server-priced catalog views"
          git push origin HEAD:feat/zarinpal-melipayamak-mobile-2026
